<html lang="en" manifest="/cache.appcache">

<head>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>PiouAutoLoader Installer v[[VERSION_PLACEHOLDER]] (built [[BUILD_TIME_PLACEHOLDER]])</title>
  <style>
    * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      position: relative;
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #070b14;
      background: -webkit-radial-gradient(120% 90% at 50% -10%, #12203a 0%, #0a1020 45%, #070b14 100%);
      color: #e2e8f0;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      min-height: 100%;
      text-align: center;
      overflow-x: hidden;
    }

    /* ── animated backdrop ─────────────────────────────────────────────── */
    #bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    #glow {
      position: absolute; top: -30%; left: 50%; width: 130vh; height: 130vh; margin-left: -65vh;
      border-radius: 50%;
      background: -webkit-radial-gradient(circle, rgba(56,189,248,0.16) 0%, rgba(56,189,248,0.05) 40%, rgba(56,189,248,0) 70%);
      background: radial-gradient(circle, rgba(56,189,248,0.16) 0%, rgba(56,189,248,0.05) 40%, rgba(56,189,248,0) 70%);
      -webkit-animation: breathe 7s ease-in-out infinite;
      animation: breathe 7s ease-in-out infinite;
    }
    #scan {
      position: absolute; left: 0; right: 0; height: 180px;
      background: -webkit-linear-gradient(top, rgba(56,189,248,0) 0%, rgba(56,189,248,0.05) 50%, rgba(56,189,248,0) 100%);
      background: linear-gradient(to bottom, rgba(56,189,248,0) 0%, rgba(56,189,248,0.05) 50%, rgba(56,189,248,0) 100%);
      -webkit-animation: sweep 11s ease-in-out infinite;
      animation: sweep 11s ease-in-out infinite;
    }
    @-webkit-keyframes breathe { 0%,100% { opacity: .7; -webkit-transform: scale(1); } 50% { opacity: 1; -webkit-transform: scale(1.06); } }
    @keyframes breathe { 0%,100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
    @-webkit-keyframes sweep { 0% { top: -200px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @keyframes sweep { 0% { top: -200px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @-webkit-keyframes pulse { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.15); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    @-webkit-keyframes floaty { 0%,100% { -webkit-transform: translateY(0); } 50% { -webkit-transform: translateY(-8px); } }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    main {
      position: relative;
      z-index: 10;
      max-width: 44rem;
      padding: 2.5rem 2rem;
    }

    .logo {
      display: inline-block;
      width: 7rem;
      height: 7rem;
      margin-bottom: 1.4rem;
      -webkit-animation: floaty 5s ease-in-out infinite;
      animation: floaty 5s ease-in-out infinite;
      -webkit-filter: drop-shadow(0 0 22px rgba(56,189,248,0.55));
      filter: drop-shadow(0 0 22px rgba(56,189,248,0.55));
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      line-height: 1.15;
      margin-bottom: 1rem;
      background: -webkit-linear-gradient(90deg, #e6f3ff 0%, #7dd3fc 55%, #7df966 120%);
      background: linear-gradient(90deg, #e6f3ff 0%, #7dd3fc 55%, #7df966 120%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: #7dd3fc;
    }
    h1 .thin { -webkit-text-fill-color: #7f8ea3; color: #7f8ea3; font-weight: 500; }

    p { font-size: 1.3rem; line-height: 1.5; color: #94a3b8; }

    #status {
      font-size: 1.5rem;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }

    #detail { font-size: 1.1rem; color: #94a3b8; }

    #progressWrap {
      position: relative;
      width: 100%;
      max-width: 32rem;
      height: 2.2rem;
      margin: 1.75rem auto 0;
      background: #101827;
      border: 1px solid #22304a;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
    }
    #progressWrap[hidden] { display: none !important; }

    #progressBar {
      position: absolute; top: 0; left: 0; height: 100%; width: 100%;
      background: #38bdf8;
      background: -webkit-linear-gradient(90deg, #2563eb 0%, #38bdf8 55%, #7df966 130%);
      background: linear-gradient(90deg, #2563eb 0%, #38bdf8 55%, #7df966 130%);
      -webkit-transform: scaleX(0);
      transform: scaleX(0);
      -webkit-transform-origin: left center;
      transform-origin: left center;
      -webkit-transition: -webkit-transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 0 18px rgba(56,189,248,0.5);
    }

    #progressPct {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      color: #fff; font-size: 0.95rem; font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.7);
      z-index: 1; pointer-events: none;
    }

    #logContainer {
      margin-top: 1rem;
      width: 100%;
      max-width: 40rem;
      height: 12rem;
      background: rgba(5,8,15,0.85);
      border: 1px solid #1b2b45;
      border-radius: 12px;
      overflow-y: auto;
      text-align: left;
      font-family: "SFMono-Regular", Menlo, Monaco, "Courier New", monospace;
      font-size: 0.82rem;
      padding: 0.7rem 0.9rem;
      color: #93a4b8;
      white-space: pre-wrap;
      word-wrap: break-word;
      line-height: 1.5;
    }
    #logContainer[hidden] { display: none !important; }
    #logContainer.error { color: #f87171; }
    #logContainer div { -webkit-animation: fadein 0.25s ease-out; animation: fadein 0.25s ease-out; }
    @-webkit-keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

    /* ── choice cards ──────────────────────────────────────────────────── */
    #choiceContainer {
      margin-top: 1.75rem;
      width: 100%;
      max-width: 40rem;
      margin-left: auto;
      margin-right: auto;
    }
    #choiceContainer[hidden] { display: none !important; }

    .choice-grid { display: -webkit-box; display: -webkit-flex; display: flex; gap: 1.25rem; margin-top: 1rem; text-align: left; }

    .choice-card {
      -webkit-box-flex: 1; -webkit-flex: 1; flex: 1;
      background: rgba(27,36,54,0.85);
      border: 2px solid #2c3e5a;
      border-radius: 14px;
      padding: 1.5rem 1.25rem;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-box-direction: normal;
      -webkit-flex-direction: column; flex-direction: column;
      cursor: pointer;
      color: inherit;
      font-family: inherit;
      -webkit-transition: border-color .2s, -webkit-transform .2s, background-color .2s, box-shadow .2s;
      transition: border-color .2s, transform .2s, background-color .2s, box-shadow .2s;
      outline: none;
    }
    .choice-card.selected { border-color: rgba(56,189,248,0.4); background-color: rgba(56,189,248,0.06); box-shadow: 0 0 0 3px rgba(56,189,248,0.18); }
    .choice-card:hover, .choice-card:focus { border-color: #38bdf8; background-color: #22304a; -webkit-transform: translateY(-3px); transform: translateY(-3px); box-shadow: 0 12px 28px rgba(0,0,0,0.4), 0 0 0 3px rgba(56,189,248,0.35); }
    .choice-card:disabled { opacity: .6; cursor: not-allowed; pointer-events: none; }
    .choice-card .choice-title { font-size: 1.5rem; font-weight: 700; color: #38bdf8; margin-bottom: 0.3rem; }
    .choice-card .choice-fw {
      display: inline-block; align-self: flex-start;
      font-size: 0.78rem; font-weight: 600; color: #7dd3fc;
      background: rgba(56,189,248,0.12); border: 1px solid rgba(56,189,248,0.3);
      border-radius: 999px; padding: 0.2rem 0.6rem; margin-bottom: 0.85rem;
    }
    .choice-card .choice-desc { font-size: 0.95rem; color: #cbd5e1; line-height: 1.5; }

    /* ── corrupt-cache overlay ─────────────────────────────────────────── */
    #cacheCorruptOverlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(2,6,23,0.88);
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      z-index: 100;
      -webkit-animation: fadein 0.3s ease-out;
      animation: fadein 0.3s ease-out;
    }
    #cacheCorruptOverlay .card {
      background: #131d31;
      border: 1px solid #2c3e5a;
      border-radius: 16px;
      max-width: 36rem;
      margin: 1.5rem;
      padding: 2.25rem;
      text-align: center;
      box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    }
    #cacheCorruptOverlay h2 { font-size: 1.6rem; font-weight: 700; color: #fbbf24; margin-bottom: 1rem; }
    #cacheCorruptOverlay p { font-size: 1.1rem; line-height: 1.6; color: #cbd5e1; margin-bottom: 1.5rem; }
    #cacheCorruptOverlay .actions { display: -webkit-box; display: -webkit-flex; display: flex; -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center; gap: 1rem; }
    #cacheCorruptOverlay .actions[hidden] { display: none !important; }
    #cacheCorruptOverlay .btn { font-size: 1.1rem; font-weight: 600; padding: 0.8rem 1.6rem; border-radius: 10px; border: none; cursor: pointer; font-family: inherit; }
    #cacheCorruptOverlay .btn.primary { background: #2563eb; background: -webkit-linear-gradient(90deg, #2563eb 0%, #38bdf8 100%); background: linear-gradient(90deg, #2563eb 0%, #38bdf8 100%); color: #fff; box-shadow: 0 8px 22px rgba(37,99,235,0.4); }
    #cacheCorruptOverlay .btn.secondary { background: #334155; color: #e2e8f0; }

    #footer {
      position: fixed; bottom: 12px; left: 50%;
      -webkit-transform: translateX(-50%); transform: translateX(-50%);
      font-size: 0.75rem; color: #44546b; line-height: 1.5; text-align: center; z-index: 20;
    }

    /* ── terminal states ──────────────────────────────────────────────── */
    body.is-done .logo { -webkit-filter: drop-shadow(0 0 26px rgba(34,197,94,0.7)); filter: drop-shadow(0 0 26px rgba(34,197,94,0.7)); }
    body.is-error .logo { -webkit-filter: drop-shadow(0 0 26px rgba(239,68,68,0.7)); filter: drop-shadow(0 0 26px rgba(239,68,68,0.7)); }

    @media (max-width: 640px) {
      .choice-grid { -webkit-box-orient: vertical; -webkit-box-direction: normal; -webkit-flex-direction: column; flex-direction: column; }
      h1 { font-size: 1.8rem; }
      #status { font-size: 1.25rem; }
    }

  </style>

</head>

<body>
  <div id="bg" aria-hidden="true">
    <div id="glow"></div>
    <div id="scan"></div>
  </div>

  <main>
    <img class="logo" src="/logo.svg" alt="PiouAutoLoader" />
    <h1>PiouAutoLoader <span class="thin">Installer</span></h1>
    <p id="status">Loading&hellip;</p>
    <p id="detail"></p>

    <div id="choiceContainer" hidden>
      <div class="choice-grid">
        <button type="button" class="choice-card" id="btnPoops">
          <div class="choice-title">Poops</div>
          <div class="choice-fw">FW 7.00 &ndash; 12.00</div>
          <div class="choice-desc">Works completely offline. Does not require any network connection or active network interface.</div>
        </button>
        <button type="button" class="choice-card" id="btnRelapse">
          <div class="choice-title">Relapse</div>
          <div class="choice-fw">FW 7.00 &ndash; 13.60 (except 9.05, 11.40)</div>
          <div class="choice-desc">Requires an active network interface (Wi-Fi or Ethernet). Internet access is not required.</div>
        </button>
      </div>
    </div>

    <div id="progressWrap" hidden>
      <div id="progressBar"></div>
      <div id="progressPct">0%</div>
    </div>
    <div id="logContainer" hidden></div>

  </main>

  <footer id="footer">PiouAutoLoader Installer v[[VERSION_PLACEHOLDER]] &middot; built [[BUILD_TIME_PLACEHOLDER]]<br />Free and open source &middot; github.com/YOUR_GITHUB/piou-autoloader</footer>

  <script>
    (function () {
      'use strict';

      function detectFirmware() {
        var m = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
        if (!m) return null;
        return { str: m[1], num: parseFloat(m[1]) };
      }

      var statusEl = document.getElementById('status');
      var detailEl = document.getElementById('detail');
      var choiceContainer = document.getElementById('choiceContainer');
      var btnPoops = document.getElementById('btnPoops');
      var btnRelapse = document.getElementById('btnRelapse');
      var progressWrap = document.getElementById('progressWrap');
      var progressBar = document.getElementById('progressBar');
      var progressPct = document.getElementById('progressPct');
      var completed = false;
      var isDownloading = false;
      var isRetry = false;
      var currentUid = '';
      var chosenExploit = '';
      var fwParam = '';
      var simulateCorrupt = false;
      var corruptionPromptShown = false;

      (function () {
        var params = new URLSearchParams(window.location.search);
        isRetry = params.get('retry') === '1';
        currentUid = params.get('uid') || '';
        chosenExploit = params.get('exploit') || '';
        fwParam = params.get('fw') || '';
        /* Test hook: ?simulate=corrupt forces the corruption prompt without
         * needing a real AppCache error (e.g. for quick UI testing in a
         * desktop browser via `make dev`). */
        simulateCorrupt = params.get('simulate') === 'corrupt';
      })();

      /* Firmware support definitions:
         - <= 5.50: umtx2
         - 7.00 - 12.00: poops
         - 7.00 - 13.60 (except 9.05, 11.40): relapse */
      function isUmtx2Supported(num) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        return n > 0 && n <= 5.50;
      }

      function isPoopsSupported(num) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        return n >= 7.00 && n <= 12.00;
      }

      function isRelapseSupported(num, str) {
        var n = typeof num === 'number' ? num : parseFloat(num);
        var s = str || (typeof num === 'string' ? num : '');
        var isExcluded = (s === '9.05' || s === '11.40' ||
                          Math.abs(n - 9.05) < 0.001 || Math.abs(n - 11.40) < 0.001);
        return n >= 7.00 && n <= 13.60 && !isExcluded;
      }

      var fw = detectFirmware();
      var fwStr = fw ? fw.str : fwParam;
      var fwNum = fw ? fw.num : (fwParam ? parseFloat(fwParam) : 0);
      var hasUmtx2 = isUmtx2Supported(fwNum);
      var hasPoops = isPoopsSupported(fwNum);
      var hasRelapse = isRelapseSupported(fwNum, fwStr);
      var isUnsupported = fwNum > 0 && !hasUmtx2 && !hasPoops && !hasRelapse;
      var isDualSupported = (hasPoops && hasRelapse) || (!fw && !fwParam);
      var needsChoice = isDualSupported && !chosenExploit;

      function chooseExploit(choice) {
        if (btnPoops) btnPoops.disabled = true;
        if (btnRelapse) btnRelapse.disabled = true;
        statusEl.textContent = 'Selected ' + (choice === 'poops' ? 'Poops' : 'Relapse') + '...';
        detailEl.textContent = 'Preparing cache download...';
        try {
          localStorage.setItem('piou_exploit', choice);
        } catch (e) { }
        var p = new URLSearchParams(window.location.search);
        p.set('exploit', choice);
        window.location.replace(window.location.pathname + '?' + p.toString());
      }

      if (btnPoops) {
        btnPoops.addEventListener('click', function () {
          chooseExploit('poops');
        });
      }
      if (btnRelapse) {
        btnRelapse.addEventListener('click', function () {
          chooseExploit('relapse');
        });
      }

      var logContainer = document.getElementById('logContainer');
      var seenLogs = "";

      function appendLog(msg) {
        if (needsChoice || isUnsupported) return;
        logContainer.hidden = false;
        var div = document.createElement('div');
        div.textContent = msg;
        logContainer.appendChild(div);
        logContainer.scrollTop = logContainer.scrollHeight;
      }


      var logPos = 0;
      var logXhr = null;

      function pollLogs() {
        if (needsChoice || isUnsupported) return;
        logXhr = new XMLHttpRequest();
        logXhr.open('GET', '/logs?pos=' + logPos, true);
        logXhr.onreadystatechange = function () {
          if (logXhr.readyState === 4) {
            if (logXhr.status === 200) {
              var newLogs = logXhr.responseText;
              if (newLogs.length > 0) {
                var lines = newLogs.split('\n');
                for (var i = 0; i < lines.length; i++) {
                  if (lines[i].trim() !== '') appendLog(lines[i]);
                }
              }
              var newPosStr = logXhr.getResponseHeader("X-Log-Pos");
              if (newPosStr) {
                logPos = parseInt(newPosStr, 10);
              }
              // Add a slight delay before reconnecting to reduce server load
              setTimeout(pollLogs, 100);
            } else {
              // Server is down or error
              if (completed) return; // Stop polling completely if we finished
              setTimeout(pollLogs, 1000);
            }
          }
        };
        logXhr.send();
      }
      // Start the long-polling loop only when caching (not on choice, not on unsupported)
      if (!needsChoice && !isUnsupported) {
        pollLogs();
      }


      var probeOk = false;


      var AUTOLOADER_URL = '/app/index.html';

      function setProgress(pct) {
        progressBar.style.webkitTransform = 'scaleX(' + pct / 100 + ')';
        progressBar.style.transform = 'scaleX(' + pct / 100 + ')';
        progressPct.textContent = pct + '%';
      }

      function setInstalled() {
        statusEl.textContent = 'Installed successfully';
        statusEl.style.color = '#22c55e';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #16a34a 0%, #22c55e 100%)';
        detailEl.textContent = 'The PiouAutoLoader shortcut is now on your PS5 homescreen. You can close this page.';
        setProgress(100);
      }

      function setFailed() {
        statusEl.textContent = 'Install failed';
        statusEl.style.color = '#ef4444';
        progressBar.style.background = '-webkit-linear-gradient(90deg, #dc2626 0%, #ef4444 100%)';
        detailEl.textContent = 'The app could not be installed. Close this page and re-run the installer.';
      }

      function setSlow() {
        statusEl.textContent = 'Caching is taking unusually long';
        detailEl.textContent = 'The shortcut is only created after the cache finishes. If this never completes, close the browser and re-run the installer.';
      }

      function setCaching() {
        statusEl.textContent = 'Caching content...';
        detailEl.textContent = 'Please wait a moment. Do not close this page yet!';
        progressWrap.hidden = false;
        if (!logXhr) {
          pollLogs();
        }
      }

      function goToAutoloader() {
        window.location.replace(AUTOLOADER_URL);
      }

      function probeServer() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/version', true);
        xhr.timeout = 1000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              var hdrUid = xhr.getResponseHeader("X-User-Id");
              if (hdrUid) currentUid = hdrUid;
              probeOk = true;
              setCaching();
            } else {
              goToAutoloader();
            }
          }
        };
        xhr.onerror = function () {
          goToAutoloader();
        };
        xhr.ontimeout = function () {
          goToAutoloader();
        };
        xhr.send();
      }

      function installApp() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/install', true);
        xhr.timeout = 30000;
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status === 200) {
              setInstalled();
            } else {
              setFailed();
            }
          }
        };
        xhr.onerror = function () {
          setFailed();
        };
        xhr.ontimeout = function () {
          setFailed();
        };
        xhr.send();
      }

      function maybeInstall() {
        if (completed) {
          return;
        }
        completed = true;
        installApp();
      }

      function setCacheCorrupted() {
        if (corruptionPromptShown) {
          return;
        }
        corruptionPromptShown = true;
        completed = true;
        progressWrap.hidden = true;
        logContainer.hidden = true;
        statusEl.textContent = 'Caching failed';
        detailEl.textContent = '';

        var overlay = document.createElement('div');
        overlay.id = 'cacheCorruptOverlay';

        var card = document.createElement('div');
        card.className = 'card';

        var title = document.createElement('h2');
        var msg = document.createElement('p');
        var actions = null;

        var webkitShellPath = '/user/home/' + (currentUid || '<userid>') + '/webkit/shell/';

        if (isRetry) {
          title.textContent = 'Cache issue persists';
          msg.textContent = 'Clearing WebKit data from ' + webkitShellPath + ' didn\'t seem to fix the issue. You can close this page.';
          var exitXhr = new XMLHttpRequest();
          exitXhr.open('GET', '/exit', true);
          exitXhr.send();
        } else {
          title.textContent = 'WebKit cache appears corrupted';
          msg.textContent = 'Your PS5\'s WebKit browser data may be corrupted, preventing the cache from completing. Clearing it may fix the issue. ';
          var strong = document.createElement('strong');
          strong.textContent = 'This will remove all browser data in ' + webkitShellPath + ' (AppCache, cookies, local storage) for the current user.';
          msg.appendChild(strong);

          actions = document.createElement('div');
          actions.className = 'actions';

          var clearBtn = document.createElement('button');
          clearBtn.className = 'btn primary';
          clearBtn.textContent = 'Clear WebKit Data & Retry';
          clearBtn.addEventListener('click', function () {
            actions.hidden = true;
            actions.style.display = 'none';
            msg.textContent = 'Clearing data and restarting browser...';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/clear-webkit-data', true);
            xhr.timeout = 30000;
            xhr.onreadystatechange = function () {
              if (xhr.readyState === 4 && xhr.status !== 200) {
                msg.textContent = 'Failed to clear WebKit data';
                actions.hidden = false;
                actions.style.display = '';
              }
            };
            xhr.onerror = function () {
              msg.textContent = 'Failed to clear WebKit data';
              actions.hidden = false;
              actions.style.display = '';
            };
            xhr.ontimeout = function () {
              msg.textContent = 'Failed to clear WebKit data';
              actions.hidden = false;
              actions.style.display = '';
            };
            xhr.send();
          });
          actions.appendChild(clearBtn);

          var cancelBtn = document.createElement('button');
          cancelBtn.className = 'btn secondary';
          cancelBtn.textContent = 'Cancel';
          cancelBtn.addEventListener('click', function () {
            msg.textContent = 'You can close this page. Re-run the installer ELF to try again.';
            actions.hidden = true;
            actions.style.display = 'none';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/exit', true);
            xhr.send();
          });
          actions.appendChild(cancelBtn);
        }

        card.appendChild(title);
        card.appendChild(msg);
        if (actions) {
          card.appendChild(actions);
        }
        overlay.appendChild(card);
        document.body.appendChild(overlay);
      }

      window.addEventListener('load', function () {
        /* Test hook: ?simulate=corrupt forces the corruption prompt as if an
         * AppCache error fired during download, and skips the probe/install
         * polling so the prompt stays up for UI testing (e.g. make dev). */
        if (simulateCorrupt) {
          isDownloading = true;
          setCacheCorrupted();
          return;
        }

        if (needsChoice) {
          statusEl.textContent = 'Select Exploit';
          var fwDisplay = fw ? ('Firmware ' + fw.str) : (fwParam ? ('Firmware ' + fwParam) : 'Your firmware');
          detailEl.textContent = '';
          detailEl.appendChild(document.createTextNode(fwDisplay + ' supports both Poops and Relapse.'));
          detailEl.appendChild(document.createElement('br'));
          detailEl.appendChild(document.createTextNode('Select which one to install:'));
          choiceContainer.hidden = false;
          logContainer.hidden = true;
          var storedPref = '';
          try { storedPref = localStorage.getItem('piou_exploit'); } catch (e) { }
          if (storedPref === 'relapse' && btnRelapse) {
            btnRelapse.classList.add('selected');
            btnRelapse.focus();
          } else if (storedPref === 'poops' && btnPoops) {
            btnPoops.classList.add('selected');
            btnPoops.focus();
          } else if (btnPoops) {
            btnPoops.focus();
          }
          return;
        }

        if (isUnsupported) {
          statusEl.textContent = 'Unsupported firmware';
          statusEl.style.color = '#ef4444';
          var fwDisplay = fw ? ('Firmware ' + fw.str) : (fwParam ? ('Firmware ' + fwParam) : 'Your firmware');
          detailEl.textContent = fwDisplay + ' is not supported (supported: 1.00–5.50 via umtx2, 7.00–12.00 via poops, 7.00–13.60 via relapse).';
          return;
        }

        var effectiveExploit = '';
        if (hasUmtx2) {
          effectiveExploit = 'umtx2';
        } else if (hasPoops && !hasRelapse) {
          effectiveExploit = 'poops';
        } else if (hasRelapse && !hasPoops) {
          effectiveExploit = 'relapse';
        } else if (hasPoops && hasRelapse) {
          effectiveExploit = (chosenExploit === 'poops') ? 'poops' : 'relapse';
        } else if (chosenExploit) {
          effectiveExploit = chosenExploit;
        }
        if (effectiveExploit) {
          try {
            localStorage.setItem('piou_exploit', effectiveExploit);
          } catch (e) { }
        }

        probeServer();

        /* The shortcut is created only once the AppCache is current, so the
           installer never installs a partial cache. /install then both installs
           the homescreen app and stops the server. */
        var waitTimer = setInterval(function () {
          if (completed) {
            clearInterval(waitTimer);
            return;
          }
          if (!probeOk) {
            clearInterval(waitTimer);
            goToAutoloader();
            return;
          }
          if (!window.applicationCache) {
            clearInterval(waitTimer);
            maybeInstall();
            return;
          }
          if (window.applicationCache.status === window.applicationCache.UPDATEREADY) {
            clearInterval(waitTimer);
            try {
              window.applicationCache.swapCache();
            } catch (e) { }
            maybeInstall();
            return;
          }
        }, 1000);

        /* Safety cap — never leave the installer hanging on screen. It does NOT
           install or exit: a partial cache must never create a shortcut, so the
           user simply re-runs the installer if this never completes. */
        setTimeout(function () {
          if (!completed && probeOk) {
            setSlow();
          }
        }, 120000);
      });


      if (window.applicationCache) {
        window.applicationCache.addEventListener('checking', function () {
          progressWrap.hidden = false;
          appendLog("[AppCache] Checking for manifest...");
        });
        window.applicationCache.addEventListener('downloading', function () {
          isDownloading = true;
          appendLog("[AppCache] Downloading cache...");
        });
        window.applicationCache.addEventListener('progress', function (e) {
          if (e.url) appendLog("[AppCache] Fetching: " + e.url);
          if (e.total && e.total > 0) {
            var pct = Math.min(99, Math.round((e.loaded / e.total) * 100));
            setProgress(pct);
          }
        });
        window.applicationCache.addEventListener('error', function (e) {
          appendLog("[AppCache] Error occurred! Status: " + window.applicationCache.status);
          logContainer.className = 'error';
          if (isDownloading) {
            setCacheCorrupted();
          }
        });
        window.applicationCache.addEventListener('obsolete', function (e) {
          appendLog("[AppCache] Manifest is obsolete.");
        });
        window.applicationCache.addEventListener('cached', function() {
          isDownloading = false;
          appendLog("[AppCache] Caching complete.");
          maybeInstall();
        });
        window.applicationCache.addEventListener('noupdate', function() {
          isDownloading = false;
          appendLog("[AppCache] No update needed.");
          maybeInstall();
        });
        window.applicationCache.addEventListener('updateready', function () {
          isDownloading = false;
          if (window.applicationCache.status === window.applicationCache.UPDATEREADY) {
            try {
              window.applicationCache.swapCache();
            } catch (e) { }
          }
          appendLog("[AppCache] Update ready.");
          maybeInstall();
        });
      }
    })();
  </script>
</body>

</html>
