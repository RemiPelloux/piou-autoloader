<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiouAutoLoader</title>
  <style>
    * { margin: 0; padding: 0; -webkit-box-sizing: border-box; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #070b14;
      background: -webkit-radial-gradient(120% 90% at 50% -10%, #12203a 0%, #0a1020 45%, #070b14 100%);
      color: #e2e8f0;
      display: -webkit-box; display: -webkit-flex; display: flex;
      -webkit-box-orient: vertical; -webkit-box-direction: normal;
      -webkit-flex-direction: column; flex-direction: column;
      -webkit-box-align: center; -webkit-align-items: center; align-items: center;
      -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
      min-height: 100%;
      text-align: center;
    }

    #glow {
      position: fixed; top: -30%; left: 50%; width: 130vh; height: 130vh; margin-left: -65vh;
      border-radius: 50%;
      background: -webkit-radial-gradient(circle, rgba(56,189,248,0.16) 0%, rgba(56,189,248,0.05) 40%, rgba(56,189,248,0) 70%);
      background: radial-gradient(circle, rgba(56,189,248,0.16) 0%, rgba(56,189,248,0.05) 40%, rgba(56,189,248,0) 70%);
      -webkit-animation: breathe 6s ease-in-out infinite;
      animation: breathe 6s ease-in-out infinite;
      pointer-events: none;
      z-index: 0;
    }

    .orb { position: relative; width: 84px; height: 84px; margin-bottom: 1.6rem; z-index: 10; }
    .orb .ring {
      position: absolute; top: 6px; left: 6px; right: 6px; bottom: 6px;
      border-radius: 50%;
      border: 3px solid rgba(56,189,248,0.14);
      border-top-color: #38bdf8;
      border-right-color: rgba(56,189,248,0.5);
      -webkit-animation: spin 1.3s linear infinite;
      animation: spin 1.3s linear infinite;
    }
    .orb .ring.r2 {
      top: 18px; left: 18px; right: 18px; bottom: 18px;
      border-width: 2px;
      border-top-color: rgba(125,249,102,0.9);
      border-right-color: rgba(125,249,102,0.2);
      -webkit-animation: spin 2.1s linear infinite reverse;
      animation: spin 2.1s linear infinite reverse;
    }
    .orb .core {
      position: absolute; top: 50%; left: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px;
      border-radius: 50%;
      background: -webkit-radial-gradient(circle at 35% 30%, #bfe9ff, #38bdf8 45%, #2563eb 100%);
      background: radial-gradient(circle at 35% 30%, #bfe9ff, #38bdf8 45%, #2563eb 100%);
      box-shadow: 0 0 18px rgba(56,189,248,0.75), 0 0 40px rgba(56,189,248,0.35);
      -webkit-animation: pulse 2s ease-in-out infinite;
      animation: pulse 2s ease-in-out infinite;
    }

    @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @-webkit-keyframes pulse { 0%,100% { -webkit-transform: scale(1); } 50% { -webkit-transform: scale(1.16); } }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.16); } }
    @-webkit-keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
    @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }

    p {
      position: relative;
      z-index: 10;
      font-size: 1.375rem;
      line-height: 1.5;
      color: #94a3b8;
      max-width: 30rem;
      padding: 0 1rem;
    }

    p.bad { color: #f87171; }
  </style>
</head>

<body>
  <div id="glow" aria-hidden="true"></div>
  <div class="orb" aria-hidden="true">
    <span class="ring"></span>
    <span class="ring r2"></span>
    <span class="core"></span>
  </div>
  <main>
    <p id="status">Loading&hellip;</p>
  </main>

  <script>
    (function () {
      'use strict';

      var dir = '[[APP_DIR_PLACEHOLDER]]';
      var version = '[[VERSION_PLACEHOLDER]]';
      var statusEl = document.getElementById('status');

      function fail() {
        statusEl.textContent = 'Cache incomplete - run the installer again.';
        statusEl.className = 'bad';
      }

      /* __complete__ is the LAST entry of the AppCache manifest, so if it is
         present (with our version content) every file before it was downloaded.
         Only then point at the app. If the marker is missing, this fetch falls
         back to this very page (content mismatch) or errors - never redirect
         into a partially cached directory. */
      fetch('/app/' + dir + '/__complete__')
        .then(function (r) {
          return r.text();
        })
        .then(function (t) {
          if (t.trim() === version) {
            window.location.replace('/app/' + dir + '/index.html');
          } else {
            fail();
          }
        })
        .catch(fail);
    })();
  </script>
</body>

</html>
